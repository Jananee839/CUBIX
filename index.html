<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DIGITAL HEALTH RECORD MANAGER</title>

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>

<body>

<!-- LOGIN PAGE -->
<div id="loginPage" class="center">

  <h1>DIGITAL HEALTH RECORD MANAGER</h1>
  <p>Secure Digital Health Record System</p>

  <input type="email" id="email" placeholder="Enter Email">
  <input type="password" id="password" placeholder="Enter Password">

  <button onclick="login()">Login</button>

</div>

<!-- MAIN APP -->
<div id="app" style="display:none;">

  <h2 id="welcome">Hello User!</h2>

  <!-- OPTIONS -->
  <div>
    <button onclick="showUpload()">Upload File</button>
    <button onclick="showQR()">Scan QR</button>
  </div>

  <!-- FILE UPLOAD SECTION -->
  <div id="uploadSection" style="display:none;">

    <h3>Select Medical Category</h3>

    <select id="category">
      <option value="">-- Choose Category --</option>
      <option value="Heart">Heart Problem</option>
      <option value="Lungs">Lungs Problem</option>
      <option value="Diabetes">Diabetes</option>
      <option value="Kidney">Kidney</option>
      <option value="Other">Other</option>
    </select>

    <input type="text" id="customCategory" placeholder="Or create your own category">

    <br>

    <input type="file" id="fileInput">

    <br>

    <button onclick="upload()">Upload File</button>

  </div>

  <!-- QR SECTION -->
  <div id="qrSection" style="display:none;">

    <h3>Scan QR Code</h3>
    <div id="reader" style="width:300px; margin:auto;"></div>

  </div>

  <!-- DISPLAY TABLE -->
  <h3>Uploaded Records</h3>

  <table border="1" style="margin:auto;">
    <thead>
      <tr>
        <th>Category</th>
        <th>File Name</th>
      </tr>
    </thead>
    <tbody id="dataTable"></tbody>
  </table>

</div>

<!-- JS FILE -->
<script src="script.js"></script>

</body>
</html>
